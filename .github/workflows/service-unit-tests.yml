name: Service unit tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: service-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            jinja2==3.1.6 \
            -r services/emailservice/requirements.txt

      - name: Run supplemental Python unit tests
        run: |
          python -m unittest \
            tests.test_email_service \
            tests.test_loadgenerator_catalog \
            tests.test_pin_manifest_reference

      - name: Run checkout service health tests
        run: |
          cd services/checkoutservice
          go test ./... -run 'TestCheckoutServiceHealth'

      - name: Run payment service edge-case tests
        run: |
          cd services/paymentservice
          npm ci
          node --test tests/charge-edge-cases.test.js
